<meta name="theme-color" content="#2A1A14" media="(prefers-color-scheme: dark)">

<meta property="og:description" content="Repostería artesanal y café de especialidad.">

<style>
/* ==================================================================
   PRALINÉ coffee house
   Palette and type taken from the Manual de Identidad Corporativa.
   The manual's three greens (#A9B5A2 #A8A898 #565243) are retired at
   the owner's direction; green now survives only as the semantic
   open/closed status dot, never as a brand colour.
   ================================================================== */
:root{
  /* light — the brand's own cream is the primary ground */
  --ground:#EFE3D6;      /* brand warm cream                        */
  --raised:#F7F0E7;      /* derived lift for cards                  */
  --sand:#E9D8D2;        /* rose-tinted wash — replaces the manual's green #DCDCCA */
  --ink:#5A3A2E;         /* brand chocolate — 7.9:1 on cream        */
  --muted:#7A6154;       /* derived warm taupe — 4.6:1              */
  --accent:#8A5754;      /* brand rose, darkened to 4.7:1 for text  */
  --accent-soft:#A27572; /* brand rose as published — rules, fills  */
  --line:rgba(90,58,46,.16);
  --ok:#4F6B4A;          /* status only, never decoration           */
  --r:3px;
  --band:clamp(30px,7.5vw,46px);
  --pad:clamp(22px,6vw,34px);
  --maxw:34rem;
  --serif:Prata,"Times New Roman",Georgia,serif;
  --caps:"Julius Sans One","Optima",Candara,sans-serif;
  --sans:Jost,"Century Gothic","Avenir Next",Avenir,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#2A1A14; --raised:#38241C; --sand:#4A2F2C;
    --ink:#EFE3D6; --muted:#B49C8C;
    --accent:#C9938F; --accent-soft:#A27572;
    --line:rgba(239,227,214,.16); --ok:#8FAE87;
  }
}
:root[data-theme="dark"]{
  --ground:#2A1A14; --raised:#38241C; --sand:#4A2F2C;
  --ink:#EFE3D6; --muted:#B49C8C;
  --accent:#C9938F; --accent-soft:#A27572;
  --line:rgba(239,227,214,.16); --ok:#8FAE87;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.wrap{max-width:var(--maxw);margin:0 auto;position:relative}

.band{
  position:relative;padding:var(--band) var(--pad);
  border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:18px;
}
section.band:last-of-type{border-bottom:0}

/* ---------- type ---------- */
.eyebrow{
  font-family:var(--caps);font-size:12px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--muted);margin:0;
}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h2{font-family:var(--serif);font-size:clamp(1.45rem,5.6vw,1.8rem);line-height:1.2}
p{margin:0;color:var(--muted)}
a{color:inherit}

/* ---------- hero: the logo lockup, centred like the manual ---------- */
.hero{align-items:center;text-align:center;padding-top:clamp(34px,10vw,58px);gap:0}
.topbar{display:flex;justify-content:flex-end;width:100%;margin-bottom:clamp(20px,6vw,34px)}
.wordmark{
  font-family:var(--serif);
  font-size:clamp(2.9rem,15vw,4.3rem);
  line-height:.95;letter-spacing:.015em;
}
.lockup-sub{
  font-family:var(--sans);font-weight:300;
  font-size:clamp(1rem,4.4vw,1.25rem);letter-spacing:.02em;
  color:var(--ink);margin-top:2px;
}
.rule{
  height:1px;background:var(--accent-soft);width:min(190px,52%);
  transform-origin:center;margin:22px 0 18px;
}
.place{font-family:var(--caps);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.craft{margin-top:12px;font-size:.94rem;max-width:26rem}

/* ---------- controls ---------- */
.btn{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  width:100%;min-height:62px;padding:16px 22px;
  border:1px solid var(--ink);border-radius:var(--r);
  background:transparent;color:var(--ink);
  font-family:var(--sans);font-size:1.04rem;font-weight:500;
  text-decoration:none;cursor:pointer;text-align:left;
  transition:background .18s ease,color .18s ease,border-color .18s ease;
}
.btn .arw{font-size:1.05rem;opacity:.5;transition:transform .18s ease,opacity .18s ease}
.btn:hover{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn:hover .arw{transform:translateX(4px);opacity:1}
.btn-primary{background:var(--ink);color:var(--ground)}
.btn-primary:hover{background:var(--accent-soft);border-color:var(--accent-soft);color:#fff}
.btn-sub{
  display:block;font-family:var(--caps);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;opacity:.78;margin-top:5px;font-weight:400;
}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:3px}

/* ---------- social ---------- */
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{
  flex:1 1 0;min-width:96px;max-width:180px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:18px 6px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--raised);color:var(--ink);text-decoration:none;
  font-family:var(--caps);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  transition:border-color .18s ease,transform .18s ease;
}
.tile:hover{border-color:var(--accent-soft);transform:translateY(-2px)}
.tile svg{width:22px;height:22px;color:var(--accent)}

/* ---------- review ---------- */
.review{background:var(--raised)}
.stars{display:flex;gap:6px;color:var(--accent-soft)}
.stars svg{width:20px;height:20px}

/* ---------- info rows ---------- */
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{
  display:flex;align-items:center;gap:16px;padding:16px 0;
  border:0;border-bottom:1px solid var(--line);
  background:none;color:var(--ink);text-decoration:none;
  font-family:var(--sans);font-size:1rem;text-align:left;width:100%;cursor:pointer;
}
.row-ico{width:19px;height:19px;color:var(--accent);flex:none}
.row-body{flex:1;min-width:0}
.row-k{
  display:block;font-family:var(--caps);font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin-bottom:3px;
}
.row-v{display:block;font-weight:400;line-height:1.4}
.row-v.mono{font-variant-numeric:tabular-nums;letter-spacing:.03em;font-weight:500}
.row-act{
  font-family:var(--caps);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);flex:none;
}
.open-dot{display:inline-flex;align-items:center;gap:7px;font-family:var(--caps);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);flex:none}
.open-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.open-dot.shut{color:var(--muted)}

/* ---------- footer ---------- */
.foot{padding:26px var(--pad) 42px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{
  font-family:var(--caps);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;
}
.lang{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lang button{
  background:none;border:0;padding:7px 12px;cursor:pointer;color:var(--muted);
  font-family:var(--caps);font-size:11px;letter-spacing:.14em;
}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

/* ---------- menu sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:50;background:var(--ground);
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  visibility:hidden;
}
.sheet.on{transform:translateY(0);visibility:visible}
.sheet-top{flex:none;padding:calc(env(safe-area-inset-top) + 18px) var(--pad) 0;border-bottom:1px solid var(--line)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h2{font-size:clamp(1.6rem,6.5vw,2rem)}
.x{
  background:none;border:1px solid var(--line);border-radius:var(--r);
  color:var(--ink);width:40px;height:40px;flex:none;cursor:pointer;font-size:1rem;line-height:1;
}
.x:hover{border-color:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:20px;overflow-x:auto;margin-top:18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;background:none;border:0;padding:0 0 13px;cursor:pointer;
  font-family:var(--caps);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid transparent;white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-soft)}
.sheet-body{flex:1;overflow-y:auto;padding:var(--band) var(--pad) 64px;-webkit-overflow-scrolling:touch}
.sheet-inner{max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;gap:36px}
.cat{display:flex;flex-direction:column;scroll-margin-top:150px}
.cat h3{
  font-family:var(--caps);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);padding-bottom:11px;margin-bottom:6px;border-bottom:1px solid var(--line);
}
.item{display:flex;align-items:baseline;gap:9px;padding:11px 0}
.item-n{flex:none;max-width:73%;line-height:1.4}
.item-note{display:block;font-size:.82rem;color:var(--muted);margin-top:3px;line-height:1.45}
.leader{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px);min-width:10px}
.item.described .leader{border-bottom:0}
.item-p{flex:none;font-variant-numeric:tabular-nums;font-weight:500;color:var(--accent)}
/* the upsell strip — brand sand, so it reads as a card not a warning */
.cat-note{
  margin-top:14px;padding:14px 16px;background:var(--sand);border-radius:var(--r);
  font-size:.84rem;color:var(--ink);line-height:1.5;
}
.cat-note b{font-family:var(--caps);font-weight:400;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;display:block;margin-bottom:5px;color:var(--muted)}
.menu-foot{
  font-family:var(--caps);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  text-align:center;padding-top:10px;color:var(--muted);line-height:2;
}

.toast{
  position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);z-index:80;
  background:var(--ink);color:var(--ground);padding:13px 22px;border-radius:var(--r);
  font-size:.86rem;opacity:0;pointer-events:none;transition:.2s ease;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- load sequence: the rule draws out from the centre ---------- */
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rule{animation:draw .7s cubic-bezier(.4,0,.15,1) .15s both}
.band{animation:rise .55s ease both}
.band:nth-child(1){animation-delay:.04s}
.band:nth-child(2){animation-delay:.16s}
.band:nth-child(3){animation-delay:.22s}
.band:nth-child(4){animation-delay:.28s}
.band:nth-child(5){animation-delay:.34s}
.foot{animation:rise .55s ease .40s both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>

</div>

};

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const TABLE = (new URLSearchParams(location.search).get("t")||"").replace(/[^0-9A-Za-z]/g,"").slice(0,4);
let lang = "es";

function track(name, props={}){
  const p = {...props, table:TABLE||"none", lang};
  if (window.plausible) window.plausible(name,{props:p});
  if (window.gtag)      window.gtag("event",name,p);
  if (window.dataLayer) window.dataLayer.push({event:name,...p});
}

const ICON = {
  instagram:'<path d="M12 2.2c3.2 0 3.6 0 4.9.07 1.2.05 1.8.25 2.2.42.6.22 1 .48 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c0 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2 0-1.8-.2-2.2-.4a3.8 3.8 0 0 1-1.4-.9 3.8 3.8 0 0 1-.9-1.4c-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c0-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2Zm0 3.2a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2Zm0 10.9a4.3 4.3 0 1 1 0-8.6 4.3 4.3 0 0 1 0 8.6Zm8.4-11.2a1.55 1.55 0 1 1-3.1 0 1.55 1.55 0 0 1 3.1 0Z" fill="currentColor"/>',

  star:'<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="currentColor"/>',

  pin:'<path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11Z" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5" fill="none"/>',

};
const svg = (k,cls="") => `<svg viewBox="0 0 24 24" aria-hidden="true"${cls?` class="${cls}"`:""}>${ICON[k]}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

<script>
/* Café time, not device time — visitors arrive on foreign clocks */
function cafeNow(){
  const f = new Intl.DateTimeFormat("en-US",{timeZone:"America/Guayaquil",
    hour:"2-digit",minute:"2-digit",weekday:"short",hour12:false});
  const p = Object.fromEntries(f.formatToParts(new Date()).map(o=>[o.type,o.value]));
  return { day:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[p.weekday],
           mins:(+p.hour%24)*60 + (+p.minute) };
}
function isOpen(){
  const {day,mins} = cafeNow(), h = CONFIG.hours && CONFIG.hours[day];
  if(!h) return false;
  const m = s => (+s.split(":")[0])*60 + (+s.split(":")[1]);
  return mins >= m(h[0]) && mins < m(h[1]);
}

let toastTimer;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("on"),2000);
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  $$("[data-t]").forEach(el => { if(t[el.dataset.t]) el.textContent = t[el.dataset.t]; });
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  $(".place").textContent = CONFIG.city;
  $(".stars").innerHTML = svg("star").repeat(5);

  const msg = TABLE ? t.wa_msg.replace("{t}",TABLE) : t.wa_msg_plain;
  $("#waLink").href  = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
  $("#revLink").href = CONFIG.review;

  $("#tiles").innerHTML = [["instagram","Instagram"],["tiktok","TikTok"],["facebook","Facebook"]]
    .filter(([k]) => CONFIG[k])
    .map(([k,label]) => `<a class="tile" href="${CONFIG[k]}" target="_blank" rel="noopener" data-ev="social:${k}">${svg(k)}<span>${label}</span></a>`)
    .join("");

  const open = isOpen();
  let rows = `
    <div class="row" style="cursor:default">
      ${svg("clock","row-ico")}
      <span class="row-body"><span class="row-k">${t.r_hours}</span>
        <span class="row-v">${esc(CONFIG.hoursLabel[lang])}</span></span>
      <span class="open-dot ${open?"":"shut"}">${open?t.open:t.shut}</span>
    </div>
    <a class="row" href="${CONFIG.maps}" target="_blank" rel="noopener" data-ev="maps">
      ${svg("pin","row-ico")}
      <span class="row-body"><span class="row-k">${t.r_addr}</span>
        <span class="row-v">${esc(CONFIG.address)}</span></span>
      <span class="row-act">${t.a_maps}</span>
    </a>`;
  if (CONFIG.wifi) rows += `
    <button class="row" type="button" id="wifiRow">
      ${svg("wifi","row-ico")}
      <span class="row-body"><span class="row-k">${t.r_wifi}</span>
        <span class="row-v mono">${esc(CONFIG.wifi)}</span></span>
      <span class="row-act">${t.a_copy}</span>
    </button>`;
  $("#rows").innerHTML = rows;

  $("#tabs").innerHTML = CONFIG.menu.map((c,i)=>
    `<button class="tab" role="tab" data-i="${i}" aria-selected="${i===0}">${esc(c[lang])}</button>`).join("");

  $("#menuMount").innerHTML = CONFIG.menu.map((c,i)=>`
    <section class="cat" id="cat${i}">
      <h3>${esc(c[lang])}</h3>
      ${c.items.map(it=>`
        <div class="item${it.n?" described":""}">
          <span class="item-n">${esc(it[lang])}${it.n?`<span class="item-note">${esc(it.n[lang])}</span>`:""}</span>
          <span class="leader"></span>
          <span class="item-p">$${it.p}</span>
        </div>`).join("")}
      ${c.note?`<p class="cat-note"><b>${esc(c.note[lang][0])}</b>${esc(c.note[lang][1])}</p>`:""}
    </section>`).join("") + `<p class="menu-foot">${t.menu_note}</p>`;

  if (TABLE){
    const chip = $("#tableChip");
    chip.textContent = `${t.table} ${TABLE}`;
    chip.hidden = false;
  }
}

const sheet = $("#sheet");
function openSheet(e){
  if(e) e.preventDefault();
  sheet.hidden = false;
  requestAnimationFrame(()=>sheet.classList.add("on"));
  document.body.style.overflow = "hidden";
  $("#closeMenu").focus();
  history.replaceState(null,"","#menu");
  track("menu_open");
}
function closeSheet(){
  sheet.classList.remove("on");
  document.body.style.overflow = "";
  history.replaceState(null,"",location.pathname+location.search);
  setTimeout(()=>{ sheet.hidden = true; }, 340);
  $("#openMenu").focus();
}
$("#openMenu").addEventListener("click", openSheet);
$("#closeMenu").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && sheet.classList.contains("on")) closeSheet(); });

$("#tabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  $("#cat"+b.dataset.i).scrollIntoView({behavior:"smooth",block:"start"});
  track("menu_category",{category:CONFIG.menu[b.dataset.i].es});
});
const spy = new IntersectionObserver(es=>{
  es.forEach(en=>{
    if(!en.isIntersecting) return;
    const i = en.target.id.replace("cat","");
    $$("#tabs .tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.i===i)));
    const active = $(`#tabs .tab[data-i="${i}"]`);
    if(active) active.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  });
},{root:$("#sheetBody"), rootMargin:"-45% 0px -50% 0px"});

document.addEventListener("click", async e=>{
  if(e.target.closest("#wifiRow")){
    try{ await navigator.clipboard.writeText(CONFIG.wifi); toast(T[lang].copied); }
    catch{ toast(CONFIG.wifi); }
    track("wifi_copy"); return;
  }
  const link = e.target.closest("[data-ev]");
  if(link) track(link.dataset.ev.split(":")[0], {target:link.dataset.ev});
});
$("#revLink").addEventListener("click", ()=>track("review_click"));
$("#waLink").addEventListener("click",  ()=>track("whatsapp_click"));

function setLang(l, remember=true){
  lang = l;
  if(remember){ try{ localStorage.setItem("praline.lang", l); }catch{} }
  render();
  CONFIG.menu.forEach((_,i)=>spy.observe($("#cat"+i)));
}
$(".lang").addEventListener("click", e=>{
  const b = e.target.closest("button[data-lang]"); if(!b) return;
  setLang(b.dataset.lang); track("lang_switch",{to:b.dataset.lang});
});

let saved = null;
try{ saved = localStorage.getItem("praline.lang"); }catch{}
setLang(saved || ((navigator.language||"es").toLowerCase().startsWith("es") ? "es" : "en"), false);
track("page_view");
if(location.hash === "#menu") openSheet();
</script>
