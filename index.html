<head>

<title>Praline Coffee House</title>
<meta name="description" content="Praline Coffee House — café de especialidad en Baños de Agua Santa. Carta, redes y reservas.">
<meta name="theme-color" content="#16130F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E7E8E0" media="(prefers-color-scheme: light)">
<meta property="og:title" content="Praline Coffee House">
<meta property="og:description" content="Café de especialidad en Baños de Agua Santa, Ecuador.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   PRALINE COFFEE HOUSE — "Basalt & Praline"
   Design tokens. Dark-first: the café is a night place and the
   card gets tapped over candlelight more than over sunlight.
   ============================================================ */
:root{
  /* light = pale mineral stone (thermal rock), NOT paper cream */
  --ground:#E7E8E0;
  --raised:#F1F1EA;
  --sunk:#DCDDD3;
  --ink:#16130F;
  --ink-soft:#5C564C;
  --line:rgba(22,19,15,.14);
  --amber:#A9682A;
  --amber-ink:#FFF6EA;
  --verde:#3F5A3C;
  --glow:rgba(169,104,42,.10);
  --r:2px;
  --band:clamp(28px,7vw,44px);
  --pad:clamp(22px,6vw,34px);
  --maxw:34rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#16130F;
    --raised:#201B16;
    --sunk:#100E0B;
    --ink:#EDE4D6;
    --ink-soft:#9A8C78;
    --line:rgba(217,154,78,.20);
    --amber:#D99A4E;
    --amber-ink:#16130F;
    --verde:#7E9A76;
    --glow:rgba(217,154,78,.16);
  }
}
:root[data-theme="dark"]{
  --ground:#16130F;
  --raised:#201B16;
  --sunk:#100E0B;
  --ink:#EDE4D6;
  --ink-soft:#9A8C78;
  --line:rgba(217,154,78,.20);
  --amber:#D99A4E;
  --amber-ink:#16130F;
  --verde:#7E9A76;
  --glow:rgba(217,154,78,.16);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:var(--maxw);margin:0 auto;position:relative}

/* one quiet atmospheric move: amber heat behind the hero */
.wrap::before{
  content:"";position:absolute;inset:-10% -30% auto;height:52vh;
  background:radial-gradient(60% 60% at 50% 0%,var(--glow),transparent 70%);
  pointer-events:none;z-index:0;
}

/* ---------- bands: full-bleed strata split by amber hairlines ---------- */
.band{
  position:relative;z-index:1;
  padding:var(--band) var(--pad);
  border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:18px;
}
section.band:last-of-type{border-bottom:0}

/* ---------- type ---------- */
.eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-soft);margin:0;
}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.wordmark{
  font-family:Gloock,Georgia,serif;
  font-size:clamp(3.6rem,19vw,5.6rem);
  line-height:.86;letter-spacing:-.02em;
}
h2{font-family:Gloock,Georgia,serif;font-size:clamp(1.5rem,6vw,1.9rem);line-height:1.1}
p{margin:0;color:var(--ink-soft)}
.lede{color:var(--ink);font-size:1.02rem}
a{color:inherit}

/* ---------- hero ---------- */
.hero{padding-top:clamp(30px,9vw,54px);gap:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.seal{width:42px;height:42px;display:block;color:var(--amber)}
.rule{height:2px;background:var(--amber);width:100%;transform-origin:left;margin:18px 0 16px}
.sub{
  font-family:Gloock,Georgia,serif;font-size:clamp(1rem,4.6vw,1.2rem);
  letter-spacing:.34em;text-transform:uppercase;color:var(--amber);
}
.place{margin-top:14px;font-size:.85rem;letter-spacing:.04em}

/* ---------- controls ---------- */
.btn{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  width:100%;min-height:60px;padding:16px 20px;
  border:2px solid var(--ink);border-radius:var(--r);
  background:transparent;color:var(--ink);
  font-family:Archivo,sans-serif;font-size:1.02rem;font-weight:600;
  letter-spacing:.01em;text-decoration:none;cursor:pointer;
  transition:background .16s ease,color .16s ease,transform .16s ease;
}
.btn .arw{font-size:1.1rem;opacity:.55;transition:transform .16s ease}
.btn:hover{background:var(--ink);color:var(--ground)}
.btn:hover .arw{transform:translateX(4px);opacity:1}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn-primary:hover{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.btn-sub{display:block;font-weight:400;font-size:.78rem;opacity:.72;margin-top:2px}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* ---------- social tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  padding:18px 6px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--raised);color:var(--ink);text-decoration:none;
  font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  transition:border-color .16s ease,transform .16s ease;
}
.tile:hover{border-color:var(--amber);transform:translateY(-2px)}
.tile svg{width:23px;height:23px;color:var(--amber)}

/* ---------- review band ---------- */
.review{background:var(--raised)}
.stars{display:flex;gap:5px;color:var(--amber)}
.stars svg{width:22px;height:22px}

/* ---------- info rows ---------- */
.rows{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.row{
  display:flex;align-items:center;gap:16px;padding:15px 0;
  border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;
  background:none;border-left:0;border-right:0;border-top:0;
  font-family:Archivo,sans-serif;font-size:1rem;text-align:left;width:100%;cursor:pointer;
}
.row-ico{width:20px;height:20px;color:var(--amber);flex:none}
.row-body{flex:1;min-width:0}
.row-k{display:block;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.row-v{display:block;font-weight:500}
.row-v.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.row-act{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);flex:none}
.open-dot{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;color:var(--verde)}
.open-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.open-dot.shut{color:var(--ink-soft)}

/* ---------- footer ---------- */
.foot{padding:26px var(--pad) 40px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.chip{
  font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);border:1px solid var(--line);border-radius:var(--r);padding:5px 9px;
}
.lang{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lang button{
  background:none;border:0;padding:6px 11px;cursor:pointer;color:var(--ink-soft);
  font-family:Archivo,sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.1em;
}
.lang button[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}

/* ---------- menu sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:50;background:var(--ground);
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  visibility:hidden;
}
.sheet.on{transform:translateY(0);visibility:visible}
.sheet-top{
  flex:none;padding:calc(env(safe-area-inset-top) + 16px) var(--pad) 0;
  background:var(--ground);border-bottom:1px solid var(--line);
}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sheet-head h2{font-size:clamp(1.7rem,7vw,2.1rem)}
.x{
  background:none;border:1px solid var(--line);border-radius:var(--r);
  color:var(--ink);width:38px;height:38px;flex:none;cursor:pointer;font-size:1.1rem;line-height:1;
}
.x:hover{border-color:var(--amber);color:var(--amber)}
.tabs{display:flex;gap:22px;overflow-x:auto;margin-top:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;background:none;border:0;padding:0 0 12px;cursor:pointer;
  font-family:Archivo,sans-serif;font-size:.74rem;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);
  border-bottom:2px solid transparent;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.sheet-body{flex:1;overflow-y:auto;padding:var(--band) var(--pad) 60px;-webkit-overflow-scrolling:touch}
.sheet-inner{max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;gap:34px}
.cat{display:flex;flex-direction:column;gap:4px;scroll-margin-top:140px}
.cat h3{
  font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  font-family:Archivo,sans-serif;color:var(--amber);
  padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--line);
}
/* classic menu setting: name — dotted leader — price */
.item{display:flex;align-items:baseline;gap:8px;padding:9px 0}
.item-n{font-weight:500;flex:none;max-width:74%}
.item-note{display:block;font-size:.8rem;font-weight:400;color:var(--ink-soft);margin-top:2px}
.leader{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px);min-width:10px}
.item-p{flex:none;font-variant-numeric:tabular-nums;font-weight:600;color:var(--amber)}
.menu-foot{font-size:.78rem;text-align:center;padding-top:8px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);z-index:80;
  background:var(--ink);color:var(--ground);padding:12px 20px;border-radius:var(--r);
  font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:.2s ease;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- the pour: one orchestrated load sequence ---------- */
@keyframes pour{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rule{animation:pour .62s cubic-bezier(.4,0,.15,1) both}
.band{animation:rise .5s ease both}
.band:nth-child(1){animation-delay:.04s}
.band:nth-child(2){animation-delay:.14s}
.band:nth-child(3){animation-delay:.20s}
.band:nth-child(4){animation-delay:.26s}
.band:nth-child(5){animation-delay:.32s}
.foot{animation:rise .5s ease .38s both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>

  <!-- ================= SOCIAL ================= -->
  <section class="band">
    <p class="eyebrow" data-t="k_follow"></p>
    <div class="tiles" id="tiles"></div>
  </section>

  <!-- ================= PRACTICAL ================= -->
  <section class="band">
    <p class="eyebrow" data-t="k_visit"></p>
    <div class="rows" id="rows"></div>
  </section>

  <footer class="foot">
    <span class="chip" id="tableChip" hidden></span>
    <span class="chip" data-t="foot"></span>

</div>

<!-- ================= MENU SHEET ================= -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-top">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sheetTitle" data-t="menu_h"></h2>
        <button class="x" id="closeMenu" type="button" aria-label="Cerrar">&#10005;</button>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div class="sheet-inner" id="menuMount"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

/* Table number comes from the NFC tag: ...?t=07  */
const TABLE = (new URLSearchParams(location.search).get("t")||"").replace(/[^0-9A-Za-z]/g,"").slice(0,4);

let lang = "es";

/* Analytics: no-ops until you add a provider. See docs/EXECUTION-PLAN.md */
function track(name, props={}){
  const p = {...props, table:TABLE||"none", lang};
  if (window.plausible)      window.plausible(name,{props:p});
  if (window.gtag)           window.gtag("event",name,p);
  if (window.dataLayer)      window.dataLayer.push({event:name,...p});
}

  instagram:'<path d="M12 2.2c3.2 0 3.6 0 4.9.07 1.2.05 1.8.25 2.2.42.6.22 1 .48 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c0 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2 0-1.8-.2-2.2-.4a3.8 3.8 0 0 1-1.4-.9 3.8 3.8 0 0 1-.9-1.4c-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c0-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2Zm0 3.2a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2Zm0 10.9a4.3 4.3 0 1 1 0-8.6 4.3 4.3 0 0 1 0 8.6Zm8.4-11.2a1.55 1.55 0 1 1-3.1 0 1.55 1.55 0 0 1 3.1 0Z" fill="currentColor"/>',
  tiktok:'<path d="M16.6 5.8a4.9 4.9 0 0 1-1.2-3.2h-3.3v13.2a2.8 2.8 0 1 1-2-2.7V9.7a6.1 6.1 0 1 0 5.3 6V9.1a8.2 8.2 0 0 0 4.7 1.5V7.3a4.9 4.9 0 0 1-3.5-1.5Z" fill="currentColor"/>',
  facebook:'<path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.7-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7A10 10 0 0 0 22 12Z" fill="currentColor"/>',
  star:'<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="currentColor"/>',
  clock:'<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M12 7v5.2l3.4 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>',
  pin:'<path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11Z" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.7" fill="none"/>',
  wifi:'<path d="M2.5 8.5a15 15 0 0 1 19 0M5.5 12.2a10.5 10.5 0 0 1 13 0M8.6 15.9a6 6 0 0 1 6.8 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/><circle cx="12" cy="19.4" r="1.4" fill="currentColor"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
</script>

<script>
/* ---------- open / closed, always in café time -----------------
   Tourists arrive with phones still set to their home timezone,
   so never trust the device clock's zone. Pin to Guayaquil.      */
function cafeNow(){
  const f = new Intl.DateTimeFormat("en-US",{timeZone:"America/Guayaquil",
    hour:"2-digit",minute:"2-digit",weekday:"short",hour12:false});
  const p = Object.fromEntries(f.formatToParts(new Date()).map(o=>[o.type,o.value]));
  const day = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[p.weekday];
  return { day, mins:(+p.hour%24)*60 + (+p.minute) };
}
function isOpen(){
  const {day,mins} = cafeNow();
  const h = CONFIG.hours && CONFIG.hours[day];
  if(!h) return false;
  const m = s => (+s.split(":")[0])*60 + (+s.split(":")[1]);
  return mins >= m(h[0]) && mins < m(h[1]);
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("on"),2000);
}

/* ---------- render everything for the active language ---------- */
function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  $$("[data-t]").forEach(el => { const k = el.dataset.t; if(t[k]) el.textContent = t[k]; });
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));

  $(".stars").innerHTML = svg("star").repeat(5);

  /* WhatsApp — the table number rides along, so staff know where you are */
  const msg = TABLE ? t.wa_msg.replace("{t}",TABLE) : t.wa_msg_plain;
  $("#waLink").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
  $("#revLink").href = CONFIG.review;

  /* Social tiles — only render the ones that are configured */
  $("#tiles").innerHTML = ["instagram","tiktok","facebook"]
    .filter(k => CONFIG[k])
    .map(k => `<a class="tile" href="${CONFIG[k]}" target="_blank" rel="noopener" data-ev="social:${k}">
                 ${svg(k)}<span>${k==="instagram"?"Instagram":k==="tiktok"?"TikTok":"Facebook"}</span></a>`)
    .join("");

  /* Practical rows */
  const open = isOpen();
  let rows = `
    <div class="row" style="cursor:default">
      ${svg("clock").replace("<svg","<svg class=\"row-ico\"")}
      <span class="row-body">
        <span class="row-k">${t.r_hours}</span>
        <span class="row-v">${CONFIG.hoursLabel[lang]}</span>
      </span>
      <span class="open-dot ${open?"":"shut"}">${open?t.open:t.shut}</span>
    </div>
    <a class="row" href="${CONFIG.maps}" target="_blank" rel="noopener" data-ev="maps">
      ${svg("pin").replace("<svg","<svg class=\"row-ico\"")}
      <span class="row-body">
        <span class="row-k">${t.r_addr}</span>
        <span class="row-v">${CONFIG.address}</span>
      </span>
      <span class="row-act">${t.a_maps}</span>
    </a>`;
  if (CONFIG.wifi) rows += `
    <button class="row" type="button" id="wifiRow">
      ${svg("wifi").replace("<svg","<svg class=\"row-ico\"")}
      <span class="row-body">
        <span class="row-k">${t.r_wifi}</span>
        <span class="row-v mono">${CONFIG.wifi}</span>
      </span>
      <span class="row-act">${t.a_copy}</span>
    </button>`;
  $("#rows").innerHTML = rows;

  /* Menu */
  $("#tabs").innerHTML = CONFIG.menu.map((c,i)=>
    `<button class="tab" role="tab" data-i="${i}" aria-selected="${i===0}">${c[lang]}</button>`).join("");
  $("#menuMount").innerHTML = CONFIG.menu.map((c,i)=>`
    <section class="cat" id="cat${i}">
      <h3>${c[lang]}</h3>
      ${c.items.map(it=>`
        <div class="item">
          <span class="item-n">${it[lang]}${it.n?`<span class="item-note">${it.n[lang]}</span>`:""}</span>
          <span class="leader"></span>
          <span class="item-p">$${it.p}</span>
        </div>`).join("")}
    </section>`).join("") + `<p class="menu-foot">${t.menu_note}</p>`;

  if (TABLE){
    const chip = $("#tableChip");
    chip.textContent = `${t.table} ${TABLE}`;
    chip.hidden = false;
  }
}

/* ---------- menu sheet ---------- */
const sheet = $("#sheet");
function openSheet(e){
  if(e) e.preventDefault();
  sheet.hidden = false;
  requestAnimationFrame(()=>sheet.classList.add("on"));
  document.body.style.overflow = "hidden";
  $("#closeMenu").focus();
  history.replaceState(null,"","#menu");
  track("menu_open");
}
function closeSheet(){
  sheet.classList.remove("on");
  document.body.style.overflow = "";
  history.replaceState(null,"",location.pathname+location.search);
  setTimeout(()=>{ sheet.hidden = true; }, 340);
  $("#openMenu").focus();
}
$("#openMenu").addEventListener("click", openSheet);
$("#closeMenu").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && sheet.classList.contains("on")) closeSheet(); });

/* Tabs scroll the sheet; scrolling the sheet updates the tabs */
$("#tabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  $("#cat"+b.dataset.i).scrollIntoView({behavior:"smooth",block:"start"});
  track("menu_category",{category:CONFIG.menu[b.dataset.i].es});
});
const spy = new IntersectionObserver(es=>{
  es.forEach(en=>{
    if(!en.isIntersecting) return;
    const i = en.target.id.replace("cat","");
    $$("#tabs .tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.i===i)));
  });
},{root:$("#sheetBody"), rootMargin:"-45% 0px -50% 0px"});

/* ---------- delegated interactions ---------- */
document.addEventListener("click", async e=>{
  const wifi = e.target.closest("#wifiRow");
  if(wifi){
    try{ await navigator.clipboard.writeText(CONFIG.wifi); toast(T[lang].copied); }
    catch{ toast(CONFIG.wifi); }
    track("wifi_copy");
    return;
  }
  const link = e.target.closest("[data-ev]");
  if(link) track(link.dataset.ev.split(":")[0], {target:link.dataset.ev});
});
$("#revLink").addEventListener("click", ()=>track("review_click"));
$("#waLink").addEventListener("click",  ()=>track("whatsapp_click"));

/* ---------- language ---------- */
function setLang(l, remember=true){
  lang = l;
  if(remember){ try{ localStorage.setItem("praline.lang", l); }catch{} }
  render();
  CONFIG.menu.forEach((_,i)=>spy.observe($("#cat"+i)));
}
$(".lang").addEventListener("click", e=>{
  const b = e.target.closest("button[data-lang]"); if(!b) return;
  setLang(b.dataset.lang); track("lang_switch",{to:b.dataset.lang});
});

/* Boot: remembered choice → device language → Spanish.
   Baños runs on tourism, so an English speaker must never land on Spanish. */
let start = "es";
try{ start = localStorage.getItem("praline.lang") || start; }
catch{}
if(!(()=>{try{return localStorage.getItem("praline.lang")}catch{return null}})()){
  start = (navigator.language||"es").toLowerCase().startsWith("es") ? "es" : "en";
}
setLang(start, false);
track("page_view");
if(location.hash === "#menu") openSheet();
</script>
</body>
</html>
